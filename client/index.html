<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var host = location.hostname;
        if (
          location.protocol === "http:" &&
          host !== "localhost" &&
          host !== "127.0.0.1"
        ) {
          location.replace(
            "https://" + location.host + location.pathname + location.search + location.hash,
          );
        } else if (host !== "localhost" && host !== "127.0.0.1") {
          var meta = document.createElement("meta");
          meta.httpEquiv = "Content-Security-Policy";
          meta.content = "upgrade-insecure-requests";
          document.head.appendChild(meta);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fovea — Weekly focus for your work</title>
    <meta
      name="description"
      content="Fovea helps project managers and individuals pick one weekly focus and stay organized with channels, tasks, and a visual map."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
